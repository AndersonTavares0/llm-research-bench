# Tool calling at controlled context lengths; native tool_calls vs JSON-constrained.
campaign: gpu-lab-toolcall-longctx
description: Tool selection and argument quality for Qwen3-1.7B at 1.9k/3.8k prompts.
status: measured
hardware_profile: gpu-lab-ct108-gtx1050ti-4gib

server:
  port: 8090
  ctx_size: 8192
  gpu_layers: 99
  threads: 2
  parallel: 1
  startup_timeout_s: 300
  cache_ram: 0
  cache_type_k: q8_0
  cache_type_v: q8_0

bench:
  prompt_tokens: 512
  gen_tokens: 128
  repetitions: 1

evaluation:
  limit: 18
  seed: 42
  clients: 1
  context_fill: 1900
  tool_format: native
  max_gen_toks: 256
  timeout_s: 600

models:
  - name: qwen3-1.7b-q4km
    alias: qwen3-1.7b
    file: Qwen3-1.7B-Q4_K_M.gguf
    quantization: Q4_K_M
    hf_repo: ggml-org/Qwen3-1.7B-GGUF
    hf_revision: daeb8e2d528a760970442092f6bf1e55c3b659eb
    license: apache-2.0
    sha256: d2387ca2dbfee2ffabce7120d3770dadca0b293052bc2f0e138fdc940d9bc7b5

task_groups:
  - name: tools
    backend: capability
    tasks: [tool_call]
