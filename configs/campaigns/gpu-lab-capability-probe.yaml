# Capability probe campaign: JSON-schema adherence and tool-call validity for
# Qwen3-1.7B on the GPU Lab GTX 1050 Ti. Runs through the same lease machinery
# as the quality campaigns; results land in the campaign summary schema.
# These are fixed synthetic probes (10 + 5 cases), not a leaderboard task.
campaign: gpu-lab-capability-probe-v1
description: >-
  Structured-output and tool-call probes on Qwen3-1.7B Q4_K_M, measuring pass
  rate and end-to-end client latency at temperature 0.
status: measured
hardware_profile: gpu-lab-ct108-gtx1050ti-4gib

server:
  port: 8090
  ctx_size: 4096
  gpu_layers: 99
  threads: 2
  parallel: 1
  startup_timeout_s: 300
  cache_ram: 0
  chat_template_kwargs:
    enable_thinking: false

bench:
  prompt_tokens: 512
  gen_tokens: 128
  repetitions: 3

evaluation:
  limit: 10
  seed: 42
  num_fewshot: 0
  batch_size: 1
  max_length: 2048
  max_gen_toks: 256
  timeout_s: 1800

models:
  - name: qwen3-1.7b-q4km
    alias: qwen3-1.7b
    file: Qwen3-1.7B-Q4_K_M.gguf
    quantization: Q4_K_M
    hf_repo: ggml-org/Qwen3-1.7B-GGUF
    hf_revision: daeb8e2d528a760970442092f6bf1e55c3b659eb
    license: apache-2.0
    sha256: d2387ca2dbfee2ffabce7120d3770dadca0b293052bc2f0e138fdc940d9bc7b5

task_groups:
  - name: structured
    backend: capability
    tasks: [structured_output]
  - name: tools
    backend: capability
    tasks: [tool_call]
