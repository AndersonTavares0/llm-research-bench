# ==============================================================================
# 2. Candidate SLM Catalog (Analytical Memory & Architecture Engineering Survey)
# Note: These models are cataloged and modeled analytically for 4 GB edge feasibility.
# Empirical throughput/accuracy benchmarks are NOT fabricated for these candidates.
# ==============================================================================
candidate_slm_catalog:
  - id: "qwen3:0.6B"
    huggingface_repo: "Qwen/Qwen3-0.6B-Instruct"
    vendor: "Alibaba Cloud"
    license: "Apache-2.0"
    parameters_billion: 0.6
    topology:
      layers: 28
      kv_heads: 2
      head_dim: 128
      bytes_per_tok_fp16: 28672 # 28 KiB
    recommended_quant: "Q4_K_M"
    static_weights_mib: 460
    estimated_kv_cache_4k_fp16_mib: 112
    estimated_total_vram_4k_mib: 828 # 460 + 112 + 256
    vram_budget_fraction_pct: 20.2
    llama_cpp_support: "NATIVE (Qwen architecture)"
    edge_suitability: "Ultra-high headroom; allows high concurrency or long context up to 64k tokens."

  - id: "qwen3:1.7B"
    huggingface_repo: "Qwen/Qwen3-1.7B-Instruct"
    vendor: "Alibaba Cloud"
    license: "Apache-2.0"
