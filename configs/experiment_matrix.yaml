# Experimental Matrix for Small Language Model Evaluation Under Severe VRAM Constraints
suite_version: "v2.0"
target_hardware:
  gpu: "NVIDIA GeForce GTX 1050 Ti"
  vram_mib: 4096
  bus_width_bit: 128
  bandwidth_gb_s: 112.0
  host_cpu: "AMD Ryzen 5 3600 (6C/12T)"
  guest_env: "Isolated Debian 12 / Linux 6.8 with direct PCI Passthrough"
  cuda_runtime_overhead_mib: 256

# ==============================================================================
# 1. Empirically Evaluated Models (Laboratory Reference Testbed Measurements)
# ==============================================================================
empirically_evaluated_models:
  - id: "gemma4:E2B"
    architecture: "Gemma-4"
    parameters_billion: 2.0
    quantization: "IQ4_XS"
    speculative_draft: "mtp-gemma-4-E2B-it-Q8_0"
    empirical_peak_vram_mib: 1510
    vram_budget_fraction_pct: 36.8
    empirical_decode_tok_s: 46.3
    empirical_prompt_tok_s: 468.2
    status: "EMPIRICALLY_VERIFIED"
