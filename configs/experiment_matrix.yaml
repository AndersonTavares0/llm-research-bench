    estimated_total_vram_4k_mib: 1660 # 1180 + 224 + 256
    vram_budget_fraction_pct: 40.5
    llama_cpp_support: "NATIVE (Qwen architecture)"
    edge_suitability: "Optimal balance between reasoning density and memory headroom (60% VRAM free)."

