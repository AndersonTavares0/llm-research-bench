name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pytest
      - name: Run unit tests
        run: |
          python -m pytest tests/

  compile-reports:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Tectonic LaTeX engine
        uses: Willem-J-an/setup-tectonic@v1
      - name: Compile Portuguese Scientific Report
        run: |
          tectonic reports/pt-BR/report_pt-BR.tex --outdir reports/pt-BR
      - name: Compile English Scientific Report
        run: |
          tectonic reports/en-US/report_en-US.tex --outdir reports/en-US
      - name: Upload PDF Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: scientific-reports
          path: |
            reports/pt-BR/report_pt-BR.pdf
            reports/en-US/report_en-US.pdf
