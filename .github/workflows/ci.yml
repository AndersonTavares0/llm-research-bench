name: CI

on:
  push:
    branches: [ main, "fix/**", "feat/**", "chore/**" ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pytest

      - name: Run unit tests
        run: |
          python -m pytest tests/

  compile-reports:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Tectonic LaTeX engine
        uses: wtfjoke/setup-tectonic@v4
        with:
          tectonic-version: "latest"
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Compile Portuguese Scientific Report
        run: |
          tectonic reports/pt-BR/report_pt-BR.tex --outdir reports/pt-BR

      - name: Compile English Scientific Report
        run: |
          tectonic reports/en-US/report_en-US.tex --outdir reports/en-US

      - name: Upload PDF Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: scientific-reports
          path: |
            reports/pt-BR/report_pt-BR.pdf
            reports/en-US/report_en-US.pdf

  validate-website:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "pnpm"
          cache-dependency-path: website/pnpm-lock.yaml

      - name: Verify build and accessibility
        run: |
          cd website
          pnpm install --frozen-lockfile
          pnpm build
          pnpm exec playwright install --with-deps chromium
          node scripts/validate_accessibility.mjs
