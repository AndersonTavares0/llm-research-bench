name: Propose Model Candidate
description: Propose a new Small Language Model (SLM) for analytical evaluation or experimental inclusion
labels: ["model-catalog", "enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Please fill out this form to propose a new model for inclusion in `configs/experiment_matrix.yaml`.
        Note: Models must fit within a $\le 4096\text{ MiB}$ VRAM budget.
  - type: input
    id: model_name
    attributes:
      label: Model Name & Identifier
      placeholder: "Qwen/Qwen3-1.7B-Instruct"
    validations:
      required: true
  - type: input
    id: hf_repo
    attributes:
      label: Official Hugging Face Repository URL
      placeholder: "https://huggingface.co/Qwen/Qwen3-1.7B-Instruct"
    validations:
      required: true
  - type: dropdown
    id: license
    attributes:
      label: Model License
      options:
        - "Apache-2.0"
        - "MIT"
        - "Gemma Terms of Use"
        - "Llama 3.2 Community"
        - "Other Open / Permissive"
    validations:
      required: true
  - type: input
    id: vram_footprint
    attributes:
      label: Estimated Peak VRAM Footprint in Q4_K_M (MiB)
      description: Include weights + 4k KV cache + 256 MiB CUDA overhead.
      placeholder: "1660 MiB (40.5% of 4096 MiB)"
    validations:
      required: true
  - type: textarea
    id: justification
    attributes:
      label: Architectural Justification & Research Value
      description: Why is this model relevant to resource-constrained edge research?
    validations:
      required: true
